<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Radar Montevideo</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #101416;
        }

        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #d9d6cc;
        }

        .leaflet-tile {
            filter:
                saturate(.82)
                contrast(1.08)
                brightness(1.04);
        }

        .leaflet-container {
            background: #d9d6cc;
        }

        .leaflet-control-zoom {
            margin-bottom: 90px !important;
            margin-right: 10px !important;
            border: 0 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,.28) !important;
        }

        .leaflet-control-zoom a {
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            color: #172025 !important;
            background: rgba(255,255,255,.94) !important;
            border: 0 !important;
        }

        #topHud {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: min(94vw, 480px);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(8,14,17,.92);
            backdrop-filter: blur(14px);
            box-shadow:
                0 8px 30px rgba(0,0,0,.32),
                inset 0 1px rgba(255,255,255,.06);
        }

        #status {
            flex: 1;
            min-width: 0;
            padding: 9px 11px;
            border-radius: 12px;
            color: #e9fbff;
            background: rgba(255,255,255,.06);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #headingBox {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #111b20;
            border: 1px solid rgba(255,255,255,.12);
        }

        #headingIndicator {
            width: 24px;
            height: 24px;
            position: relative;
            transition: transform .18s linear;
        }

        #headingIndicator::before {
            content: "";
            position: absolute;
            left: 9px;
            top: 1px;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 16px solid #20d8ff;
        }

        #headingIndicator::after {
            content: "N";
            position: absolute;
            top: 23px;
            left: 8px;
            color: #fff;
            font-size: 7px;
            font-weight: 900;
        }

        #controls {
            position: fixed;
            left: 50%;
            bottom: max(12px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 2000;
            width: min(96vw, 520px);
            display: flex;
            gap: 6px;
            padding: 7px;
            border-radius: 18px;
            background: rgba(8,14,17,.94);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }

        #controls button {
            flex: 1;
            min-width: 0;
            min-height: 42px;
            border: 0;
            border-radius: 12px;
            padding: 8px 7px;
            color: #fff;
            background: #202d32;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        #controls button.active {
            color: #071014;
            background: #20d8ff;
        }

        #controls button.orange.active {
            color: #1a0e00;
            background: #ff8a00;
        }

        #settings {
            position: fixed;
            right: 10px;
            top: max(70px, calc(env(safe-area-inset-top) + 62px));
            z-index: 2000;
            width: 178px;
            padding: 10px;
            border-radius: 16px;
            background: rgba(8,14,17,.92);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 28px rgba(0,0,0,.3);
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 4px;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
        }
