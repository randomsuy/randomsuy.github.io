<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Radar</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #controls {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 12px;
            background: rgba(10, 15, 18, .92);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .35);
        }

        #controls button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            background: #222c30;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #controls button:hover {
            background: #304047;
        }

        #controls button.active {
            background: #168b97;
        }

        #controls button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        #status {
            position: fixed;
            left: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            background: rgba(10, 15, 18, .88);
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
        }

        #radarWarning {
            position: fixed;
            left: 50%;
            bottom: max(60px, calc(env(safe-area-inset-bottom) + 60px));
            transform: translateX(-50%);
            z-index: 1001;
            display: none;
            min-width: 220px;
            padding: 12px 16px;
            border: 2px solid #ff3131;
            border-radius: 12px;
            color: #fff;
            background: rgba(50, 0, 0, .94);
            text-align: center;
            box-shadow: 0 0 24px rgba(255, 49, 49, .5);
        }

        #radarWarning.active {
            display: block;
        }

        #radarWarningDistance {
            display: block;
            font-size: 24px;
            font-weight: 900;
        }

        #radarWarningLimit {
            display: block;
            margin-top: 4px;
            color: #ff5b5b;
            font-size: 14px;
            font-weight: 800;
        }

        .leaflet-control-attribution {
            font-size: 9px;
        }

        .keolel-camera-marker,
        .keolel-radar-marker,
        .keolel-user-marker {
            background: transparent !important;
            border: 0 !important;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="controls">
    <button id="gpsButton">
        GPS
    </button>

    <button id="simulationButton">
        MODO PRUEBA
    </button>

    <button id="moveButton">
        AVANZAR
    </button>

    <button id="resetButton">
        RESET
    </button>
</div>

<div id="status">
    INICIANDO...
</div>

<div id="radarWarning">
    <span id="radarWarningDistance">
        -- M
    </span>

    <span id="radarWarningLimit">
        RADAR
    </span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="traffic-map.js"></script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        () => {
            const simulationButton =
                document.getElementById(
                    "simulationButton"
                );

            const moveButton =
                document.getElementById(
                    "moveButton"
                );

            const resetButton =
                document.getElementById(
                    "resetButton"
                );

            const gpsButton =
                document.getElementById(
                    "gpsButton"
                );

            function updateButtons() {
                const active =
                    window.TrafficMap
                        ?.simulation
                        ?.active === true;

                simulationButton.classList.toggle(
                    "active",
                    active
                );

                moveButton.classList.toggle(
                    "active",
                    active
                );

                moveButton.disabled =
                    !active;
            }

            simulationButton.addEventListener(
                "click",
                () => {
                    if (!window.TrafficMap) {
                        return;
                    }

                    if (
                        window.TrafficMap
                            .simulation
                            .active
                    ) {
                        window.TrafficMap
                            .stopSimulation();
                    } else {
                        window.TrafficMap
                            .startSimulation();
                    }

                    updateButtons();
                }
            );

            moveButton.addEventListener(
                "click",
                () => {
                    if (
                        !window.TrafficMap
                            ?.simulation
                            ?.active
                    ) {
                        return;
                    }

                    window.TrafficMap
                        .simulationStep();
                }
            );

            resetButton.addEventListener(
                "click",
                () => {
                    window.TrafficMap
                        ?.resetSimulation();

                    updateButtons();
                }
            );

            gpsButton.addEventListener(
                "click",
                () => {
                    window.TrafficMap
                        ?.requestLocation(true);
                }
            );

            setInterval(
                updateButtons,
                250
            );

            updateButtons();
        }
    );
</script>

</body>
</html>
