<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Radar Montevideo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #071014;
}

#map {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.leaflet-tile-pane {
    filter:
        contrast(1.12)
        saturate(.72)
        brightness(1.06);
}

.leaflet-control-zoom {
    margin-top: 100px !important;
    margin-right: 10px !important;
    border: 0 !important;
    box-shadow: 0 4px 20px rgba(0,0,0,.3) !important;
}

.leaflet-control-zoom a {
    width: 38px !important;
    height: 38px !important;
    line-height: 38px !important;
    background: rgba(8,15,19,.94) !important;
    color: #fff !important;
    border: 0 !important;
}

#topHud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: min(94vw, 560px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}

#navigationHud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 13px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 17px;
    color: #fff;
    background: rgba(8,15,19,.9);
    box-shadow:
        0 8px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(13px);
}

#headingBox {
    display: flex;
    align-items: center;
    gap: 9px;
}

#headingArrow {
    width: 31px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #36c8d8;
    font-size: 25px;
    font-weight: 900;
    transition: transform .12s linear;
}

#headingValue {
    font-size: 13px;
    font-weight: 900;
}

#gpsState {
    color: #8cecf3;
    font-size: 10px;
    font-weight: 900;
}

#controls {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px;
    pointer-events: auto;
    scrollbar-width: none;
}

#controls::-webkit-scrollbar {
    display: none;
}

#controls button {
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 11px;
    padding: 9px 11px;
    color: #fff;
    background: rgba(8,15,19,.94);
    font-size: 10px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.22);
}

#controls button.active {
    color: #071014;
    background: #36c8d8;
}

#controls button.red.active {
    color: #fff;
    background: #e83939;
}

#controls button.orange.active {
    color: #111;
    background: #ff9f1c;
}

#controls button.yellow.active {
    color: #111;
    background: #ffd166;
}

#controls button:disabled {
    opacity: .35;
}

#status {
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 1000;
    width: max-content;
    max-width: 92vw;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    color: #fff;
    background: rgba(8,15,19,.9);
    font-size: 10px;
    font-weight: 900;
    pointer-events: none;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

#radarWarning {
    position: fixed;
    left: 50%;
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 60px));
    transform: translateX(-50%);
    z-index: 1001;
    display: none;
    min-width: 230px;
    max-width: 88vw;
    padding: 12px 18px;
    border: 2px solid #ff3131;
    border-radius: 15px;
    color: #fff;
    background: rgba(36,5,5,.95);
    text-align: center;
    box-shadow: 0 0 30px rgba(255,49,49,.4);
    pointer-events: none;
}

#radarWarning[data-type="camera"] {
    border-color: #ff9f1c;
    background: rgba(55,30,0,.95);
    box-shadow: 0 0 30px rgba(255,159,28,.35);
}

#radarWarning[data-type="deadEnd"] {
    border-color: #ffd166;
    background: rgba(55,42,0,.95);
    box-shadow: 0 0 30px rgba(255,209,102,.35);
}

#radarWarning.active {
    display: block;
}

#radarWarningDistance {
    display: block;
    font-size: 27px;
    font-weight: 900;
}

#radarWarningLimit {
    display: block;
    margin-top: 3px;
    font-size: 13px;
    font-weight: 900;
}

.map-popup {
    min-width: 180px;
    color: #111;
    font-family: Arial, sans-serif;
    line-height: 1.45;
}

.traffic-user-marker,
.traffic-radar-marker,
.traffic-camera-marker,
.traffic-deadend-marker {
    background: transparent !important;
    border: 0 !important;
}

.user-marker {
    width: 46px;
    height: 46px;
    position: relative;
    transform-origin: center;
    filter: drop-shadow(0 2px 7px rgba(0,0,0,.45));
}

.user-arrow {
    position: absolute;
    top: 1px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 20px solid #36c8d8;
}

.user-dot {
    position: absolute;
    width: 22px;
    height: 22px;
    left: 12px;
    top: 13px;
    border-radius: 50%;
    background: #36c8d8;
    border: 3px solid #071014;
    box-shadow:
        0 0 0 3px rgba(54,200,216,.25),
        0 0 18px rgba(54,200,216,.8);
}

.radar-marker {
    position: relative;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #190708;
    border: 2px solid #ff3131;
    color: #ff5b5b;
    font-family: monospace;
    font-size: 11px;
    font-weight: 900;
    box-shadow:
        0 0 12px rgba(255,49,49,.8),
        0 0 25px rgba(255,49,49,.3);
}

.radar-ring {
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(255,49,49,.5);
    border-radius: 50%;
}

.camera-marker {
    position: relative;
    width: 40px;
    height: 34px;
    margin-top: 5px;
    border-radius: 8px;
    background: #ff9f1c;
    border: 2px solid #7b4300;
    box-shadow:
        0 0 14px rgba(255,159,28,.7),
        0 4px 12px rgba(0,0,0,.35);
}

.camera-body {
    position: absolute;
    width: 20px;
    height: 12px;
    left: 8px;
    top: 9px;
    border-radius: 4px;
    background: #171717;
}

.camera-lens {
    position: absolute;
    z-index: 2;
    width: 8px;
    height: 8px;
    left: 22px;
    top: 11px;
    border-radius: 50%;
    background: #36c8d8;
    border: 2px solid #071014;
}

.deadend-marker {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #111;
    background: #ffd166;
    border: 2px solid #8a6500;
    font-size: 20px;
    font-weight: 900;
    box-shadow:
        0 0 14px rgba(255,209,102,.6),
        0 4px 12px rgba(0,0,0,.3);
}

@media (max-width: 600px) {
    #controls button {
        padding: 9px 10px;
        font-size: 10px;
    }

    #navigationHud {
        padding: 9px 11px;
    }

    .leaflet-control-zoom {
        margin-top: 105px !important;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="topHud">

    <div id="navigationHud">

        <div id="headingBox">
            <div id="headingArrow">↑</div>
            <div id="headingValue">000°</div>
        </div>

        <div id="gpsState">
            GPS OFF
        </div>

    </div>

    <div id="controls">

        <button id="gpsButton">
            GPS
        </button>

        <button id="simulationButton">
            PRUEBA
        </button>

        <button id="moveButton">
            AVANZAR
        </button>

        <button id="resetButton">
            RESET
        </button>

        <button id="voiceButton" class="active">
            VOZ
        </button>

        <button id="radarButton" class="red active">
            RADAR
        </button>

        <button id="cameraButton" class="orange active">
            CÁMARAS
        </button>

        <button id="deadEndButton" class="yellow active">
            SIN SALIDA
        </button>

    </div>

</div>

<div id="status">
    INICIANDO...
</div>

<div id="radarWarning">
    <span id="radarWarningDistance">
        -- M
    </span>

    <span id="radarWarningLimit">
        RADAR
    </span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="traffic-map.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const simulationButton =
        document.getElementById(
            "simulationButton"
        );

    const moveButton =
        document.getElementById(
            "moveButton"
        );

    const resetButton =
        document.getElementById(
            "resetButton"
        );

    const gpsButton =
        document.getElementById(
            "gpsButton"
        );

    const voiceButton =
        document.getElementById(
            "voiceButton"
        );

    const radarButton =
        document.getElementById(
            "radarButton"
        );

    const cameraButton =
        document.getElementById(
            "cameraButton"
        );

    const deadEndButton =
        document.getElementById(
            "deadEndButton"
        );

    function updateButtons() {

        const app =
            window.TrafficMap;

        if (!app) {
            return;
        }

        const simulation =
            app.simulation;

        const alerts =
            app.alerts;

        const orientation =
            app.orientation;

        simulationButton.classList.toggle(
            "active",
            simulation.active
        );

        moveButton.classList.toggle(
            "active",
            simulation.active
        );

        moveButton.disabled =
            !simulation.active;

        voiceButton.classList.toggle(
            "active",
            alerts.voice
        );

        radarButton.classList.toggle(
            "active",
            alerts.radar
        );

        cameraButton.classList.toggle(
            "active",
            alerts.camera
        );

        deadEndButton.classList.toggle(
            "active",
            alerts.deadEnd
        );

        const heading =
            Number(
                orientation.heading ||
                simulation.heading ||
                0
            );

        document.getElementById(
            "headingValue"
        ).textContent =
            `${Math.round(heading)
                .toString()
                .padStart(3, "0")}°`;

        document.getElementById(
            "headingArrow"
        ).style.transform =
            `rotate(${heading}deg)`;

        document.getElementById(
            "gpsState"
        ).textContent =
            orientation.active
                ? "BRÚJULA ACTIVA"
                : (
                    app.simulation.active
                        ? "MODO PRUEBA"
                        : "GPS ACTIVO"
                );
    }

    simulationButton.addEventListener(
        "click",
        async () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            if (
                app.simulation.active
            ) {
                app.stopSimulation();
            } else {
                await app.startSimulation();
            }

            updateButtons();
        }
    );

    moveButton.addEventListener(
        "click",
        () => {

            const app =
                window.TrafficMap;

            if (
                !app?.simulation?.active
            ) {
                return;
            }

            app.simulationStep();

            updateButtons();
        }
    );

    resetButton.addEventListener(
        "click",
        () => {

            window.TrafficMap
                ?.resetSimulation();

            updateButtons();
        }
    );

    gpsButton.addEventListener(
        "click",
        async () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            app.requestLocation(true);

            try {
                await app.requestOrientation();
            } catch {}
            
            updateButtons();
        }
    );

    voiceButton.addEventListener(
        "click",
        () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            app.setVoice(
                !app.alerts.voice
            );

            updateButtons();
        }
    );

    radarButton.addEventListener(
        "click",
        () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            app.setAlert(
                "radar",
                !app.alerts.radar
            );

            updateButtons();
        }
    );

    cameraButton.addEventListener(
        "click",
        () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            app.setAlert(
                "camera",
                !app.alerts.camera
            );

            updateButtons();
        }
    );

    deadEndButton.addEventListener(
        "click",
        () => {

            const app =
                window.TrafficMap;

            if (!app) {
                return;
            }

            app.setAlert(
                "deadEnd",
                !app.alerts.deadEnd
            );

            updateButtons();
        }
    );

    setInterval(
        updateButtons,
        250
    );

    updateButtons();

});
</script>

</body>
</html>
